<button (click)="togglePlanDate()" cButton color="info">Launch demo modal</button>

<br />
<c-modal #modalPlanDate (visibleChange)="handlePlanDateChange($event)" [visible]="planDateVisible" id="modalPlanDate">
  <c-modal-header>
    <h5 cModalTitle>Çalışma Planı</h5>

    <button (click)="togglePlanDate()" cButtonClose></button>
  </c-modal-header>

  <br />

  <br />

  <c-modal-body>
    <form [formGroup]="addPlanDateForm" cForm>
      <c-row>
        <c-col lg="7">
          <label class="form-label" for="startDate">Başlangıç Tarihi</label>

          <c-date-picker closeOnSelect="" formControlName="startDate" placeholder="Tarih Seçin" id="startDate" locale="en-ca" />
        </c-col>

        <c-col lg="5">
          <label class="form-label" for="startTime">Başlangıç Saati</label>

          <c-time-picker formControlName="startTime" inputReadOnly="" placeholder="saat Seçin" id="startTime"  locale="tr" />
        </c-col>
      </c-row>

      <c-row>
        <c-col lg="7">
          <label class="form-label" for="endDate">Bitiş Tarihi</label>

          <c-date-picker closeOnSelect formControlName="endDate" placeholder="Tarih Seçin" id="endDate"  locale="en-ca"/>
        </c-col>

        <c-col lg="5">
          <label class="form-label" for="endTime">Bitiş Saati</label>

          <c-time-picker #timePicker="cTimePicker" formControlName="endTime" placeholder="saat Seçin" id="endTime"  locale="tr" />
        </c-col>
      </c-row>
    </form>
  </c-modal-body>

  <c-modal-footer>
    <button (click)="togglePlanDate()" cButton color="secondary" variant="outline">Vazgeç</button>

<!--    <button (click)="savePlanDate()" [disabled]="!addPlanDateForm.valid" cButton color="success" variant="outline">-->
    <button (click)="savePlanDate()" cButton color="success" variant="outline">
      Kaydet
    </button>
  </c-modal-footer>

  <p>{{ addPlanDateForm.value | json }}</p>
</c-modal>
