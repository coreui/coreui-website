<div class="d-flex align-items-center">
  <span class="me-3">{{ currentValue() ?? 0 }}/5</span>
  <c-rating
    [value]="currentValue()"
    (valueChange)="currentValue.set($event)"
    (hoverValueChange)="hoverValue.set($event)"
  />
  @if (label()) {
    <c-badge class="ms-3" color="dark">{{ label() }}</c-badge>
  }
</div>
