<form cForm>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword1">
      disabled
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword1" name="pwd1" placeholder="Password" [disabled]="inputDisable()" [(ngModel)]="secretPassword" />
    </c-col>
    <c-col>
      <button cButton (click)="inputDisable.set(!this.inputDisable())">Disable</button>
    </c-col>
  </c-row>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword2">
      readonly
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword2" name="pwd2" placeholder="Password" readOnly [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword3">
      normal
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword3" name="pwd3" placeholder="Password" [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword4">
      showPassword
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword4" name="pwd4" placeholder="Password" [disabled]="inputDisable()" showPassword [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword5">
      invalid
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword5" name="pwd5" placeholder="Password" [disabled]="inputDisable()" [valid]="false" [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword6">
      valid
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword6" name="pwd6" placeholder="Password" [disabled]="inputDisable()" [valid]="true" [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword7">
      large
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword7" name="pwd7" placeholder="Password" sizing="lg" [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
  <c-row class="mb-1">
    <label cLabel="col" class="col-sm-2" for="formPassword8">
      small
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword8" name="pwd8" placeholder="Password" sizing="sm" [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
  <c-row class="mb-1 align-items-center">
    <label cLabel="col" class="col-sm-2" for="formPassword9">
      floating label
    </label>
    <c-col [sm]="4">
      <input cFormPassword id="formPassword9" name="pwd9" placeholder="Password" [disabled]="inputDisable()" floatingLabel="Floating Label" [(ngModel)]="secretPassword" />
    </c-col>
  </c-row>
</form>
