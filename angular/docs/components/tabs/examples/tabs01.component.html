<c-tabs [activeItemKey]="'profile'" (activeItemKeyChange)="handleChange($event)">
  <c-tabs-list variant="tabs">
    <button cTab itemKey="home"> <svg [cIcon]="cilHome"></svg> Home</button>
    <button cTab itemKey="profile">Profile</button>
    <button cTab itemKey="contact">Contact</button>
    <button cTab itemKey="disabled" disabled>Disabled</button>
  </c-tabs-list>
  <c-tabs-content>
    <c-tab-panel class="p-3" itemKey="home">
      <strong>Home</strong> tab content
    </c-tab-panel>
    <c-tab-panel class="p-3" itemKey="profile">
      <strong>Profile</strong> tab content
    </c-tab-panel>
    <c-tab-panel class="p-3" itemKey="contact">
      <strong>Contact</strong> tab content
    </c-tab-panel>
    <c-tab-panel class="p-3" itemKey="disabled">
      <strong>Disabled</strong> tab content
    </c-tab-panel>
  </c-tabs-content>
</c-tabs>
