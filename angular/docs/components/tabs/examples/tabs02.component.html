<c-tabs [activeItemKey]="1" >
  <c-tabs-list>
    <button cTab [itemKey]="0">Home</button>
    <button cTab [itemKey]="1">Profile</button>
    <button cTab [itemKey]="2">Contact</button>
    <button cTab [itemKey]="3" disabled>Disabled</button>
  </c-tabs-list>
  <c-tabs-content>
    <c-tab-panel class="p-3" [itemKey]="0" >
      <strong>Home</strong> tab content
    </c-tab-panel>
    <c-tab-panel class="p-3" [itemKey]="1">
      <strong>Profile</strong> tab content
    </c-tab-panel>
    <c-tab-panel class="p-3" [itemKey]="2">
      <strong>Contact</strong> tab content
    </c-tab-panel>
    <c-tab-panel class="p-3" [itemKey]="3">
      <strong>Disabled</strong> tab content
    </c-tab-panel>
  </c-tabs-content>
</c-tabs>
